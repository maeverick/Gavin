name: Keep Render Services Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Express backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://gavin-rvzy.onrender.com/api/health)
          echo "Express backend: HTTP $STATUS"

      - name: Ping FastAPI AI service
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://gavin-ai.onrender.com/docs)
          echo "FastAPI AI service: HTTP $STATUS"
